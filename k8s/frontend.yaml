apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: yolo
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yolo
      component: frontend
  template:
    metadata:
      labels:
        app: yolo
        component: frontend
    spec:
      containers:
        - name: frontend
          image: hodhan/yolo-frontend:v1.0.6
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: yolo
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: yolo
    component: frontend
  ports:
    - port: 80
      targetPort: 80